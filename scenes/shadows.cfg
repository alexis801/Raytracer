# Test visuel des ombres portees
# Une sphere posee sur un plan avec une lumiere laterale

camera:
{
    resolution = { width = 800; height = 600; };
    position = { x = 0.0; y = -150.0; z = 50.0; };
    rotation = { x = -75.0; y = 0.0; z = 0.0; };
    fieldOfView = 60.0;
};

primitives:
{
    spheres = (
        { x = 0.0; y = 0.0; z = 25.0; r = 25.0;
          color = { r = 255; g = 64; b = 64; }; }
    );
    planes = (
        { axis = "Z"; position = 0.0;
          color = { r = 200; g = 200; b = 200; }; }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    point = (
        { x = 100.0; y = -50.0; z = 150.0; }
    );
    directional = ();
};
