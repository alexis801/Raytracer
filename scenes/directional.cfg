# Demo lumiere directionnelle

camera:
{
    resolution = { width = 640; height = 480; };
    position = { x = 0.0; y = -100.0; z = 20.0; };
    rotation = { x = -90.0; y = 0.0; z = 0.0; };
    fieldOfView = 72.0;
};

primitives:
{
    objects = (
        { type = "sphere"; x = 0.0; y = 10.0; z = 15.0; r = 15.0;
          color = { r = 255; g = 200; b = 64; }; },
        { type = "plane"; axis = "Z"; position = 0.0;
          color = { r = 180; g = 180; b = 180; }; }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    point = ();
    directional = (
        { x = -1.0; y = 1.0; z = -1.0; }
    );
};
